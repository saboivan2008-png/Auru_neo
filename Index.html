<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Môj Nový Projekt</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="p-6 border-b border-slate-800 flex justify-between items-center max-w-6xl mx-auto w-full">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
      MojProjekt
    </h1>
    <span class="bg-blue-500/10 text-blue-400 text-xs px-3 py-1 rounded-full border border-blue-500/20">
      v1.0.0 Live
    </span>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-6 py-20 text-center flex-1 flex flex-col justify-center items-center">
    <h2 class="text-5xl font-extrabold tracking-tight mb-6 sm:text-6xl">
      Vítajte v novom projekte
    </h2>
    <p class="text-lg text-slate-400 max-w-2xl mb-10">
      Aplikácia je úspešne prepojená cez GitHub a nasadená na globálnej sieti Cloudflare Pages.
    </p>
    <div class="flex gap-4">
      <a href="#features" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-lg transition">
        Začať preskúmavať
      </a>
      <a href="https://github.com" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-6 py-3 rounded-lg border border-slate-700 transition">
        GitHub Repo
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="p-6 border-t border-slate-800 text-center text-slate-500 text-sm">
    &copy; 2026 MojProjekt. Beží na Cloudflare Pages.
  </footer>

</body>
</html>
